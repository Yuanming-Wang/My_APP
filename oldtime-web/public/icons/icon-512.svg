<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C2F00"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- 装饰圆 -->
  <circle cx="256" cy="220" r="120" fill="none" stroke="#D4AF37" stroke-width="4" opacity="0.3"/>
  
  <!-- 文字 -->
  <text x="256" y="260" text-anchor="middle" font-family="serif" font-size="160" font-weight="bold" fill="#D4AF37">旧</text>
  
  <!-- 底部文字 -->
  <text x="256" y="380" text-anchor="middle" font-family="sans-serif" font-size="36" fill="#FFFFFF" opacity="0.8">旧时光</text>
  
  <!-- 装饰线 -->
  <line x1="156" y1="320" x2="356" y2="320" stroke="#D4AF37" stroke-width="2" opacity="0.5"/>
</svg>
