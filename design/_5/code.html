<style>
        .spotlight {
            background: radial-gradient(circle at 50% -20%, rgba(212, 175, 55, 0.4) 0%, transparent 70%);
            animation: pulse-spotlight 4s ease-in-out infinite alternate;
        }
        
        @keyframes pulse-spotlight {
            0% { opacity: 0.6; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .gold-foil {
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);

            -webkit-text-fill-color: transparent;

        /* 3D Book Animation Container */
        .perspective-container {

        .book-wrapper {
            transform-style: preserve-3d;
            animation: book-appear 3s ease-out forwards;
            transform: rotateX(20deg) rotateY(-20deg);
        }

        @keyframes book-appear {
            0% { transform: scale(0.8) rotateX(40deg) rotateY(-40deg) translateY(50px); opacity: 0; }
            100% { transform: scale(1) rotateX(15deg) rotateY(-10deg) translateY(0); opacity: 1; }
        }

        .page-anim-1 { animation: flip-page 2.5s 0.5s ease-in-out forwards; }
        .page-anim-2 { animation: flip-page 2.5s 0.8s ease-in-out forwards; }
        .page-anim-3 { animation: flip-page 2.5s 1.1s ease-in-out forwards; }

        @keyframes flip-page {
            0% { transform: rotateY(0deg); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: rotateY(-170deg); opacity: 1; }
        }

        .cover-close {
            animation: close-cover 2s 3.5s ease-in-out forwards;
            transform-origin: left;
        }

        @keyframes close-cover {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(-160deg); }
        }

        .typing-text {
            border-right: 2px solid #D4AF37;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 3s steps(8, end) 1s forwards, blink-caret .75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #D4AF37; }
        }
