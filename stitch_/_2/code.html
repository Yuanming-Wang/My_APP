<h2 class="font-headline-md text-headline-md text-primary text-center mb-stack-md">那年胡同口的自行车</h2>
<div class="font-note-text text-note-text text-on-surface leading-relaxed space-y-4">
<p>
                        这是爷爷留下的老飞鸽。那时候，这辆车是我们家最值钱的物件儿。每天傍晚，我都在胡同口等他下班，老远就能听到那清脆的车铃声。
                    </p>
<p>
                        车把上的漆早就掉光了，露出底下锃亮的铁皮，那是岁月磨出来的光泽。现在的车再轻便，也骑不出当年的那种安稳感。我把这张照片小心存着，看着它，就好像又闻到了当年胡同里飘出的饭菜香，听见了爷爷那句：“走，回家吃饭喽。”
                    </p>
